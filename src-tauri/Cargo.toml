[package]
name = "orlo"
version = "1.1.0"
description = "Tasks, notes and AI agents in one calm Windows app"
license = "MIT"
repository = "https://github.com/carbongotfound/orlo"
edition = "2021"

[lib]
name = "orlo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-notification = "2"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
